  d.innerHTML='<h3 style="margin:0 0 8px">Il tuo account</h3><p id="ai" style="margin:0 0 8px"></p><label>Dispositivi ('+dv.length+'/'+(ME.max_devices||2)+')</label><div id="dl"></div><div class="row"><button class="b" id="ac">Chiudi</button><button class="b p" id="ao">Esci</button></div>';
  document.body.appendChild(d);d.showModal();
  d.querySelector('#ai').textContent=ME.email+(ME.access_until?' · Accesso fino al '+fdate(ME.access_until):'');
  var l=d.querySelector('#dl');dv.forEach(function(x){l.appendChild(el('div',{style:'margin:2px 0;font-size:.9rem'},'• '+(x.label||'Dispositivo')))});
  d.querySelector('#ac').onclick=function(){d.close();d.remove()};d.querySelector('#ao').onclick=function(){d.close();d.remove();logout()};
};

  function fitFs(){var w=document.querySelector('.simwrap.fs'),v=window.visualViewport;if(!w||!v||v.scale>1.01)return;w.style.top=v.offsetTop+'px';w.style.left=v.offsetLeft+'px';w.style.width=v.width+'px';w.style.height=v.height+'px';w.style.right='auto';w.style.bottom='auto'}
  if(window.visualViewport){visualViewport.addEventListener('resize',fitFs);visualViewport.addEventListener('scroll',fitFs)}
  function enterFs(w){w.classList.add('fs');document.body.style.overflow='hidden';fitFs();try{var r=w.requestFullscreen&&w.requestFullscreen();if(r&&r.catch)r.catch(function(){})}catch(e){}}
  function exitFs(w){if(w){w.classList.remove('fs');w.style.cssText='';var fr=w.querySelector('iframe');if(fr)fr.style.cssText=''}document.body.style.overflow='';try{if(document.fullscreenElement){var r=document.exitFullscreen();if(r&&r.catch)r.catch(function(){})}}catch(e){}}
  function exitAll(){exitFs(document.querySelector('.simwrap.fs'))}
  document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement)exitAll()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')exitAll()});

  var gameTimer;
  function renderGame(){
    document.title='Acchiappa il cuore · MedLab Sim';
    var bar=el('div',{class:'bar'});bar.appendChild(el('a',{class:'back',href:'#'},'← Tutti'));bar.appendChild(el('h2',null,'🫀 Acchiappa il cuore'));app.appendChild(bar);
    var st=el('div',{class:'gstats'}),sc=el('span',null,'Punti: 0'),tm=el('span',null,'Tempo: 15s'),bs=el('span',null,''),go=el('button',{class:'b p'},'▶ Gioca'),msg=el('p',{class:'gmsg'},'Tocca il cuore più veloce che puoi: hai 15 secondi.'),board=el('div',{class:'gboard'});
    [sc,tm,bs,go].forEach(function(x){st.appendChild(x)});app.appendChild(st);app.appendChild(msg);app.appendChild(board);
    var cells=[],score=0,cur=-1,run=false;
    for(var k=0;k<9;k++){(function(i){var c=el('button',{class:'gcell','aria-label':'Casella'});c.onpointerdown=function(e){e.preventDefault();hit(i)};cells.push(c);board.appendChild(c)})(k)}
    function best(){try{return +localStorage.getItem('medsim_best_tap')||0}catch(e){return 0}}
    function showBest(){var b=best();bs.textContent=b?'Record: '+b:''}
    function clearCur(){if(cur>=0){cells[cur].textContent='';cells[cur].classList.remove('on')}}
    function place(){var n;do{n=Math.floor(Math.random()*9)}while(n===cur);clearCur();cur=n;cells[n].textContent='🫀';cells[n].classList.add('on')}
    function hit(i){if(!run||i!==cur)return;score++;sc.textContent='Punti: '+score;place()}
    function finish(){
      run=false;clearInterval(gameTimer);clearCur();cur=-1;tm.textContent='Tempo: 0s';
      var rec=score>best();if(rec){try{localStorage.setItem('medsim_best_tap',score)}catch(e){}}
      showBest();msg.textContent='Fine! '+score+' punti'+(rec&&score>0?' – nuovo record!':'');go.textContent='↻ Rigioca';go.disabled=false;
    }
    function start(){
      score=0;cur=-1;run=true;sc.textContent='Punti: 0';msg.textContent='';go.disabled=true;place();
      var t=Date.now()+15000;tm.textContent='Tempo: 15s';
      gameTimer=setInterval(function(){var l=Math.ceil((t-Date.now())/1000);if(l<=0)finish();else tm.textContent='Tempo: '+l+'s'},150);
    }
    go.onclick=start;showBest();
  }

  var CUR=null,lastRes=0;
  function toast(m){var t=el('div',{class:'toast'},m);document.body.appendChild(t);setTimeout(function(){t.remove()},2000)}
  function logOpen(sim){if(Date.now()-(sim._o||0)<30000)return;sim._o=Date.now();api('/rest/v1/rpc/log_activity','POST',{p_key:DK,p_sim:sim.id,p_kind:'open',p_data:''}).catch(function(){})}
  // i simulatori inviano i risultati con: parent.postMessage({medlab:'result',label:'...',score:'...',detail:'...'},'*')
  window.addEventListener('message',function(ev){
    var d=ev.data;if(!CUR||ev.source!==CUR.contentWindow||!d||d.medlab!=='result'||Date.now()-lastRes<2000)return;lastRes=Date.now();
    api('/rest/v1/rpc/log_activity','POST',{p_key:DK,p_sim:location.hash.slice(1),p_kind:'result',p_data:JSON.stringify({label:String(d.label||'').slice(0,80),score:String(d.score==null?'':d.score).slice(0,40),detail:String(d.detail||'').slice(0,200)})}).then(function(){toast('✔ Risultato salvato')}).catch(function(){});
  });
  function fillProg(box,p){
    box.textContent='';
    var T=function(id){var s=SIMS.find(function(x){return x.id===id});return s};
    var rc=(p.recent||[]).filter(function(x){return T(x.sim)});
    if(rc.length){box.appendChild(el('h3',null,'Continua da dove eri'));rc.forEach(function(x){var s=T(x.sim),a=el('a',{class:'chip',href:'#'+s.id},s.icon+' '+s.title);box.appendChild(a)})}
    var rs=(p.results||[]).filter(function(x){return T(x.sim)});
    if(rs.length){box.appendChild(el('h3',{style:'margin-top:14px'},'Ultimi risultati'));rs.slice(0,5).forEach(function(x){var s=T(x.sim),d={};try{d=JSON.parse(x.data)}catch(e){}
      box.appendChild(el('div',{class:'res'},s.title+' · '+[d.label,d.score].filter(Boolean).join(' ')+' · '+new Date(String(x.at).replace(' ','T')).toLocaleString('it-IT',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})))})}
  }

  function render(){
    var id=location.hash.slice(1),sim=SIMS.find(function(s){return s.id===id});
    if(sim&&!sim.html){app.textContent='';app.appendChild(el('p',{class:'sub'},'Caricamento…'));api('/rest/v1/rpc/get_sim','POST',{p_key:DK,p_slug:sim.id}).then(function(r){sim.html=r||' ';if(location.hash.slice(1)===sim.id)render()}).catch(function(er){app.textContent='';app.appendChild(el('p',{class:'sub'},er.message))});return}
    CUR=null;app.textContent='';app.classList.remove('v');void app.offsetWidth;app.classList.add('v');clearInterval(gameTimer);track('/'+id,sim?sim.title:id==='gioco'?'Minigioco':'Home');
    if(id==='gioco'){renderGame();window.scrollTo(0,0);return}
    if(sim){
      document.title=sim.title+' · MedLab Sim';
      var bar=el('div',{class:'bar'});bar.appendChild(el('a',{class:'back',href:'#'},'← Tutti'));bar.appendChild(el('h2',null,sim.icon+' '+sim.title));
      var w=el('div',{class:'simwrap'}),fsb=el('button',{class:'b',style:'margin-left:auto'},'⛶ Schermo intero');bar.appendChild(fsb);app.appendChild(bar);
      var f=el('iframe',{title:sim.title,sandbox:'allow-scripts allow-forms allow-modals'});f.srcdoc='<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>'+sim.html+'</body></html>';w.appendChild(f);CUR=f;logOpen(sim);
      var ctl=el('div',{class:'fsctl'}),z=1,zl=el('button',{class:'b',title:'Ripristina'},'100%'),zm=el('button',{class:'b','aria-label':'Rimpicciolisci'},'−'),zp=el('button',{class:'b','aria-label':'Ingrandisci'},'＋'),xb=el('button',{class:'b p'},'✕ Esci');
      function setZ(v){z=Math.max(.5,Math.min(2,Math.round(v*100)/100));zl.textContent=Math.round(z*100)+'%';if(w.classList.contains('fs')){f.style.width=(100/z)+'%';f.style.height=(100/z)+'%';f.style.transform='scale('+z+')';f.style.transformOrigin='0 0'}}
      zm.onclick=function(){setZ(z-.1)};zp.onclick=function(){setZ(z+.1)};zl.onclick=function(){setZ(1)};xb.onclick=function(){exitFs(w)};
      [zm,zl,zp,xb].forEach(function(x){ctl.appendChild(x)});w.appendChild(ctl);app.appendChild(w);fsb.onclick=function(){setZ(1);enterFs(w);setZ(1)};
    }else{
      document.title='MedLab Sim';
      var h1=el('h1',{style:'user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent'},'MedLab Sim'),tp=0,tt;
      h1.onclick=function(){tp++;clearTimeout(tt);tt=setTimeout(function(){tp=0},2000);if(tp>=3){tp=0;location.hash='gioco'}};
      var hd=el('div',{class:'brand'});hd.innerHTML=MARK;hd.appendChild(h1);app.appendChild(hd);
      var ec=el('div',{class:'ecgwrap','aria-hidden':'true'});ec.innerHTML='<span class="l1"></span><svg class="ecg" viewBox="0 0 200 40"><path pathLength="1" d="M0 20h40l6-5 6 5h14l5 6 6-26 7 32 6-12h20l7-7 7 7h76"/></svg><span class="l2"></span>';app.appendChild(ec);
      if(INTRO){INTRO=false;document.body.classList.add('intro');setTimeout(function(){document.body.classList.remove('intro')},2800)}
      app.appendChild(el('p',{class:'sub'},'Simulatori per la medicina: scegli un caso da provare.'));
      app.appendChild(el('p',{class:'notice'},'Strumenti per l\'esercitazione: i simulatori non sono perfetti e possono contenere errori.'));
            var pg=el('div',{class:'prog'});app.appendChild(pg);api('/rest/v1/rpc/get_progress','POST',{}).then(function(p){fillProg(pg,p)}).catch(function(){});
      var g=el('div',{class:'grid'});
      SIMS.forEach(function(s,ix){var a=el('a',{class:'card',href:'#'+s.id});a.style.setProperty('--i',ix);
        if(s.img){var th=el('div',{class:'thumb'});th.appendChild(el('img',{src:s.img,alt:'',loading:'lazy'}));a.appendChild(th)}else a.appendChild(el('div',{class:'ic'},s.icon));
        a.appendChild(el('h2',null,s.title));a.appendChild(el('p',null,s.desc));g.appendChild(a)});
      if(!SIMS.length)g.appendChild(el('p',{class:'sub'},'Nessun simulatore disponibile.'));
      app.appendChild(g);
    }
    window.scrollTo(0,0);
  }

  boot();
})();
</script>
</body>
