  if(id){try{x=(await api('/rest/v1/simulators?id=eq.'+encodeURIComponent(id)+'&select=*'))[0]}catch(e){alert(e.message);return}}
  var d=el('dialog');
  d.innerHTML='<h3 style="margin:0 0 8px">'+(id?'Modifica':'Nuovo')+' simulatore</h3><label>Titolo</label><input id="n_t"><label>Descrizione breve</label><input id="n_d"><label>Icona (emoji)</label><input id="n_i" maxlength="4"><label>Posizione (numero, più basso = prima)</label><input id="n_p" type="number"><label>Immagine di anteprima (opzionale)</label><input id="n_g" type="file" accept="image/*">'+(x.img?'<label style="display:flex;gap:8px;align-items:center"><input id="n_rm" type="checkbox" style="width:auto"> Rimuovi l\'immagine attuale</label>':'')+'<label>Carica file .html</label><input id="n_f" type="file" accept=".html,.htm"><label>…oppure incolla il codice HTML</label><textarea id="n_h"></textarea><div class="row"><button class="b" id="n_c">Annulla</button><button class="b p" id="n_s">Salva</button></div>';
  document.body.appendChild(d);d.showModal();var $=function(i){return d.querySelector('#'+i)};
  $('n_t').value=x.title;$('n_d').value=x.descr||'';$('n_i').value=x.icon||'🧪';$('n_p').value=x.position||0;$('n_h').value=x.html;
  $('n_f').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$('n_h').value=r.result;if(!$('n_t').value)$('n_t').value=f.name.replace(/\.html?$/i,'')};r.readAsText(f)};
  $('n_c').onclick=function(){d.close();d.remove()};
  $('n_s').onclick=async function(){
    var t=$('n_t').value.trim(),h=$('n_h').value.trim();if(!t||!h){alert('Titolo e codice sono obbligatori');return}
    var b=this;b.disabled=true;
    try{
      var img=x.img||'',g=$('n_g').files[0];if(g)img=await resizeImg(g);else if($('n_rm')&&$('n_rm').checked)img='';
      var row={id:id||slug(t,S.map(function(s){return s.id})),title:t,descr:$('n_d').value.trim(),icon:$('n_i').value.trim()||'🧪',position:parseInt($('n_p').value,10)||0,img:img,html:h,updated_at:new Date().toISOString()};
      await api('/rest/v1/simulators','POST',row,{Prefer:'resolution=merge-duplicates,return=minimal'});
      d.close();d.remove();sims();
    }catch(e){alert(e.message);b.disabled=false}
  };
}
init();
})();
</script>
</body>
</html>
